<!DOCTYPE html>
<html lang="en">

<head>
    <title>R D E S</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="images/systemweb/Logo.png">
    <link rel="stylesheet" href="whoStyle.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <div id="navbar"></div>

<main class="mt-4">
    <form method="post" action="#" class="container-fluid">
        <fieldset>
            <legend class="h4 mb-4">Contact Us</legend>

            <div class="mb-3">
                <label for="nameInput" class="form-label">Name</label>
                <input type="text" class="form-control inputBoxCustomerLow" id="nameInput" aria-describedby="nameHelp">
                <div id="nameHelp" class="form-text">Please provide your full name.</div>
            </div>

            <div class="mb-3">
                <label for="emailInput" class="form-label">Email Address</label>
                <input type="email" class="form-control inputBoxCustomerLow" id="emailInput" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>

            <div class="mb-3">
                <label for="descriptionInput" class="form-label">Description</label>
                <textarea id="descriptionInput" class="form-control taCustomerHigh" rows="7" aria-describedby="descriptionHelp"></textarea>
                <div id="descriptionHelp" class="form-text">Please provide a short description.</div>
            </div>
        </fieldset>
        <button class="btn btn-primary" type="submit">Button</button>
    </form>
</main>
    
        <div id="footer"></div>
            <script src="/App/src/view/js/_navbar.js"></script>
            <script src="/App/src/view/js/footer.js"></script>
</body>
</html>
