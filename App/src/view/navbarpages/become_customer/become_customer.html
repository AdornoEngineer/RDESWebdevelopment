<!DOCTYPE html>
<html lang="en">

<head>
    <title>R D E S</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="icon" href="/App/src/view/images/systemweb/Logo.png">
    <link rel="stylesheet" href="whoStyle.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div id="navbar"></div>

    <main class="mt-4 flex-grow-1">
        <form id="customerForm" class="container-fluid">
            <fieldset>
                <legend class="h4 mb-4">Contact Us</legend>

                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name</label>
                    <input 
                        type="text" 
                        class="form-control inputBoxCustomerLow" 
                        id="nameInput" 
                        aria-describedby="nameHelp"
                        required
                    >
                    <div id="nameHelp" class="form-text">Please provide your full name.</div>
                </div>

                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        class="form-control inputBoxCustomerLow" 
                        id="emailInput" 
                        aria-describedby="emailHelp"
                        required
                    >
                    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                </div>

                <div class="mb-3">
                    <label for="descriptionInput" class="form-label">Description</label>
                    <textarea 
                        id="descriptionInput" 
                        class="form-control taCustomerHigh" 
                        rows="7" 
                        aria-describedby="descriptionHelp"
                        required
                    ></textarea>
                    <div id="descriptionHelp" class="form-text">Please provide a short description.</div>
                </div>
            </fieldset>

            <button class="btn btn-primary" type="submit">Submit</button>

            <p id="formMessage" class="mt-3"></p>
        </form>
    </main>

    <div id="footer"></div>

    <script src="/App/src/assets/shared/_navbar.js"></script>
    <script src="/App/src/assets/shared/footer.js"></script>

    <script>
        document.getElementById("customerForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("nameInput").value.trim();
            const email = document.getElementById("emailInput").value.trim();
            const description = document.getElementById("descriptionInput").value.trim();
            const formMessage = document.getElementById("formMessage");

            if (!name || !email || !description) {
                formMessage.textContent = "Please fill in all fields.";
                formMessage.style.color = "red";
                return;
            }

            try {
                const response = await fetch("/api/customers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        description: description
                    })
                });

                const result = await response.json();

                if (result.success) {
                    formMessage.textContent = result.message;
                    formMessage.style.color = "green";
                    document.getElementById("customerForm").reset();
                } else {
                    formMessage.textContent = result.message;
                    formMessage.style.color = "red";
                }

            } catch (error) {
                console.error("Erro:", error);
                formMessage.textContent = "Error connecting to the server.";
                formMessage.style.color = "red";
            }
        });
    </script>

</body>

</html>
