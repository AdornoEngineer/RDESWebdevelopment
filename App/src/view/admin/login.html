<!DOCTYPE html>
<html lang="en">

<head>
    <title>Admin Login - R D E S</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="icon" href="/App/src/view/images/systemweb/Logo.png">

    <link rel="stylesheet" href="/App/src/view/admin/login.css">
</head>

<body>

    <div class="login-card">
        <h1 class="h3 login-title">Admin RDES</h1>

        <form id="loginForm">
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="emailInput" required>
            </div>

            <div class="mb-3">
                <label for="passwordInput" class="form-label">Password</label>
                <input type="password" class="form-control" id="passwordInput" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enter</button>

            <p id="loginMessage"></p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();
            const loginMessage = document.getElementById("loginMessage");

            if (!email || !password) {
                loginMessage.textContent = "Please fill in email and password.";
                loginMessage.style.color = "red";
                return;
            }

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.success) {
                    loginMessage.textContent = result.message;
                    loginMessage.style.color = "green";

                    setTimeout(() => {
                        window.location.href = "/admin/dashboard";
                    }, 800);
                } else {
                    loginMessage.textContent = result.message;
                    loginMessage.style.color = "red";
                }

            } catch (error) {
                console.error("Erro:", error);
                loginMessage.textContent = "Error connecting to the server.";
                loginMessage.style.color = "red";
            }
        });
    </script>

</body>

</html>
