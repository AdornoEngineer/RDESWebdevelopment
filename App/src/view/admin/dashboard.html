<!DOCTYPE html>
<html lang="en">

<head>
    <title>Admin Dashboard - R D E S</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale" href="/App/src/view/images/systemweb/Logo.png">    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/App/src/view/admin/dashboard.css">
</head>

<body>

    <header class="admin-header">
        <h1 class="h4 m-0">R D E S - Admin Dashboard</h1>

        <button id="logoutButton" class="btn btn-danger">
            Logout
        </button>
    </header>

    <main class="admin-container">
        <div class="card-admin">
            <div class="dashboard-title-area">
                <div>
                    <h2 class="h4">Registered Customers</h2>
                    <p class="text-muted m-0">
                        List of people registered through the Become a Customer form.
                    </p>
                </div>

                <button id="refreshButton" class="btn btn-primary">
                    Refresh
                </button>
            </div>

            <div id="messageArea"></div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Description</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="customersTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Edit Customer Modal -->
    <div class="modal fade" id="editCustomerModal" tabindex="-1" aria-labelledby="editCustomerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <form id="editCustomerForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editCustomerModalLabel">Edit Customer</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="editCustomerId">

                        <div class="mb-3">
                            <label for="editNameInput" class="form-label">Name</label>
                            <input type="text" class="form-control" id="editNameInput" required>
                        </div>

                        <div class="mb-3">
                            <label for="editEmailInput" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmailInput" required>
                        </div>

                        <div class="mb-3">
                            <label for="editDescriptionInput" class="form-label">Description</label>
                            <textarea class="form-control" id="editDescriptionInput" rows="5" required></textarea>
                        </div>

                        <p id="editMessage" class="m-0"></p>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const customersTableBody = document.getElementById("customersTableBody");
        const messageArea = document.getElementById("messageArea");
        const refreshButton = document.getElementById("refreshButton");
        const logoutButton = document.getElementById("logoutButton");

        const editCustomerForm = document.getElementById("editCustomerForm");
        const editCustomerId = document.getElementById("editCustomerId");
        const editNameInput = document.getElementById("editNameInput");
        const editEmailInput = document.getElementById("editEmailInput");
        const editDescriptionInput = document.getElementById("editDescriptionInput");
        const editMessage = document.getElementById("editMessage");

        let editModal;

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function checkLogin() {
            try {
                const response = await fetch("/api/admin/check");

                if (!response.ok) {
                    window.location.href = "/admin";
                }

            } catch (error) {
                window.location.href = "/admin";
            }
        }

        async function loadCustomers() {
            messageArea.innerHTML = "";

            customersTableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center">Loading...</td>
                </tr>
            `;

            try {
                const response = await fetch("/api/admin/customers");
                const result = await response.json();

                if (!result.success) {
                    messageArea.innerHTML = `
                        <div class="alert alert-danger">
                            ${escapeHTML(result.message)}
                        </div>
                    `;

                    customersTableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center">Error loading data.</td>
                        </tr>
                    `;
                    return;
                }

                const customers = result.customers;

                if (customers.length === 0) {
                    customersTableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center">No customers found.</td>
                        </tr>
                    `;
                    return;
                }

                customersTableBody.innerHTML = customers.map(customer => `
                    <tr>
                        <td>${escapeHTML(customer.id)}</td>
                        <td>${escapeHTML(customer.name)}</td>
                        <td>${escapeHTML(customer.email)}</td>
                        <td class="description-cell">${escapeHTML(customer.description)}</td>
                        <td>${escapeHTML(customer.created_at)}</td>
                        <td>
                            <div class="action-buttons">
                                <button 
                                    class="btn btn-warning btn-sm"
                                    onclick="openEditModal(
                                        ${Number(customer.id)}, 
                                        '${escapeForAttribute(customer.name)}', 
                                        '${escapeForAttribute(customer.email)}', 
                                        '${escapeForAttribute(customer.description)}'
                                    )">
                                    Edit
                                </button>

                                <button 
                                    class="btn btn-danger btn-sm"
                                    onclick="deleteCustomer(${Number(customer.id)})">
                                    Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join("");

            } catch (error) {
                console.error("Error:", error);

                messageArea.innerHTML = `
                    <div class="alert alert-danger">
                        Error loading customers.
                    </div>
                `;

                customersTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">Error loading data.</td>
                    </tr>
                `;
            }
        }

        function escapeForAttribute(value) {
            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'")
                .replaceAll("\n", "\\n")
                .replaceAll("\r", "");
        }

        function openEditModal(id, name, email, description) {
            editCustomerId.value = id;
            editNameInput.value = name;
            editEmailInput.value = email;
            editDescriptionInput.value = description;
            editMessage.textContent = "";

            editModal.show();
        }

        editCustomerForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const id = editCustomerId.value;
            const name = editNameInput.value.trim();
            const email = editEmailInput.value.trim();
            const description = editDescriptionInput.value.trim();

            if (!name || !email || !description) {
                editMessage.textContent = "Please fill in all fields.";
                editMessage.style.color = "red";
                return;
            }

            try {
                const response = await fetch(`/api/admin/customers/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        description
                    })
                });

                const result = await response.json();

                if (result.success) {
                    editMessage.textContent = result.message;
                    editMessage.style.color = "green";

                    await loadCustomers();

                    setTimeout(() => {
                        editModal.hide();
                    }, 700);
                } else {
                    editMessage.textContent = result.message;
                    editMessage.style.color = "red";
                }

            } catch (error) {
                console.error("Error updating customer:", error);
                editMessage.textContent = "Error updating customer.";
                editMessage.style.color = "red";
            }
        });

        async function deleteCustomer(id) {
            const confirmDelete = confirm("Are you sure you want to delete this customer?");

            if (!confirmDelete) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/customers/${id}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (result.success) {
                    messageArea.innerHTML = `
                        <div class="alert alert-success">
                            ${escapeHTML(result.message)}
                        </div>
                    `;

                    await loadCustomers();
                } else {
                    messageArea.innerHTML = `
                        <div class="alert alert-danger">
                            ${escapeHTML(result.message)}
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Error deleting customer:", error);

                messageArea.innerHTML = `
                    <div class="alert alert-danger">
                        Error deleting customer.
                    </div>
                `;
            }
        }

        refreshButton.addEventListener("click", loadCustomers);

        logoutButton.addEventListener("click", async function () {
            try {
                await fetch("/api/admin/logout", {
                    method: "POST"
                });

                window.location.href = "/admin";

            } catch (error) {
                console.error("Logout error:", error);
            }
        });

        async function startDashboard() {
            editModal = new bootstrap.Modal(document.getElementById("editCustomerModal"));

            await checkLogin();
            await loadCustomers();
        }

        startDashboard();
    </script>

</body>

</html>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
